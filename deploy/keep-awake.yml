# Render's free plan sleeps after 15 minutes without visits, which would stop the 30-minute bot. This pings it
# every 10 minutes from 08:30 to 16:30 IST on weekdays (it may sleep outside market hours; its state is backed up).
# Set the repository variable DESK_URL if the service URL differs from the default below.
name: Keep Purple Desk awake
on:
  schedule:
    - cron: "*/10 3-10 * * 1-5"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the bot
        env:
          DESK_URL: ${{ vars.DESK_URL }}
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 120 "${DESK_URL:-https://purple-desk.onrender.com}/api/health"
